name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions: {}

jobs:
  test:
    runs-on: [self-hosted, Linux, X64, wodo-ci]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.97.0"
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: ${{ runner.os != 'Linux' }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Release publication contracts
        run: python3 -m unittest discover -s scripts -p 'test_release*.py'

      - name: Tests
        run: cargo test --locked --all

  npm-installer-e2e:
    runs-on: [self-hosted, Linux, X64, wodo-ci]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20
          package-manager-cache: false

      - name: Npm installer tests (offline)
        run: |
          cd npm
          node --test

  windows-smoke:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20
          package-manager-cache: false

      - name: Npm smoke (Windows)
        shell: pwsh
        run: |
          cd npm
          node --test
          node .\bin\docdex.js doctor
