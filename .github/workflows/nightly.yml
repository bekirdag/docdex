name: Nightly Quality

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Free disk space (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /usr/local/share/chromium /usr/share/swift
          sudo rm -rf /var/lib/apt/lists/*
          df -h

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.97.0"
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: ${{ runner.os != 'Linux' }}

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20
          package-manager-cache: false

      - name: Install audit tooling
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-sbom --locked
          npm install -g npm@11.18.0

      - name: Security audit
        run: scripts/security_audit.sh

      - name: Indexing benchmark
        run: scripts/bench_indexing.sh

      - name: Build release binaries
        run: |
          cargo build --release --locked

      - name: Short soak (HTTP + MCP)
        env:
          DOCDEX_LOAD_DURATION_SECS: "60"
          DOCDEX_LOAD_CONCURRENCY: "2"
          DOCDEX_LOAD_MAX_ERROR_RATE: "0.005"
          DOCDEX_LOAD_TIMEOUT_SECS: "10"
          DOCDEX_BIN: "./target/release/docdexd"
          DOCDEX_OFFLINE: "1"
          DOCDEX_WEB_ENABLED: "0"
          DOCDEX_HTTP_BASE_URL: "http://127.0.0.1:28491"
          DOCDEX_LOAD_PATH: "/search?q=docdex&limit=5"
          DOCDEX_LOAD_REPO_ROOT: "."
        run: |
          DOCDEX_CLI_LOCAL=1 ./target/release/docdexd index --repo .
          ./target/release/docdexd serve --repo . --secure-mode=false --enable-memory=false --access-log=false --log warn --preflight-check=false &
          pid=$!
          trap 'kill "$pid"' EXIT
          for _ in {1..20}; do
            curl -fsS "${DOCDEX_HTTP_BASE_URL}/healthz" >/dev/null 2>&1 && break
            sleep 0.5
          done
          scripts/load_test_http.sh
          scripts/load_test_mcp.sh .

  artifacts:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Free disk space (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /usr/local/share/chromium /usr/share/swift
          sudo rm -rf /var/lib/apt/lists/*
          df -h

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.97.0"
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: ${{ runner.os != 'Linux' }}

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20
          package-manager-cache: false

      - name: Build release binary
        run: |
          cargo build --release --locked

      - name: Package nightly artifact
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/docdexd dist/docdexd
          tar -czf docdexd-linux-x64-gnu.tar.gz -C dist docdexd
          python -c "import hashlib, pathlib; p=pathlib.Path('docdexd-linux-x64-gnu.tar.gz'); h=hashlib.sha256(p.read_bytes()).hexdigest(); pathlib.Path(f'{p}.sha256').write_text(f'{h}  {p.name}\n')"
          node scripts/generate_release_manifest.cjs \
            --dir . \
            --out docdexd-nightly-manifest.json \
            --tag nightly \
            --repo "${GITHUB_REPOSITORY}" \
            --source-commit "${GITHUB_SHA}" \
            --allow-partial

      - name: Upload nightly artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docdexd-nightly-linux-x64-gnu
          path: |
            docdexd-linux-x64-gnu.tar.gz
            docdexd-linux-x64-gnu.tar.gz.sha256
            docdexd-nightly-manifest.json
