name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    env:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
    steps:
      - name: Release Please disabled
        if: ${{ env.RELEASE_PLEASE_TOKEN == '' }}
        run: |
          echo "Skipping release-please: set RELEASE_PLEASE_TOKEN with repo write permissions."
          echo "This repository's GitHub Actions token cannot create release PRs under current settings."
      - name: Run release-please
        if: ${{ env.RELEASE_PLEASE_TOKEN != '' }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ env.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
