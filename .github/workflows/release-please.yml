name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Release Please disabled
        if: ${{ secrets.RELEASE_PLEASE_TOKEN == '' }}
        run: |
          echo "Skipping release-please: set RELEASE_PLEASE_TOKEN with repo write permissions."
          echo "This repository's GitHub Actions token cannot create release PRs under current settings."
      - name: Run release-please
        if: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
