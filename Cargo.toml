[package]
name = "docdexd"
version = "0.1.11"
edition = "2021"

[dependencies]
anyhow = "1.0"
axum = { version = "0.7", features = ["json"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
fs4 = "0.7"
once_cell = "1.19"
parking_lot = "0.12"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
toml = "0.8"
tokio = { version = "1.39", features = ["rt-multi-thread", "macros", "signal", "time", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tantivy = { version = "0.21", default-features = false, features = ["mmap", "lz4-compression"] }
walkdir = "2.5"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
notify = "6"
zstd-sys = "=2.0.9"
ipnet = "2"
rustls-pemfile = "2"
tokio-rustls = "0.25"
hyper-util = { version = "0.1", features = ["server", "tokio", "http1", "http2", "service"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
tower = "0.4"
ammonia = "3"
aes-gcm = "0.10"
base64 = "0.22"
html2text = "0.13"
nix = { version = "0.29", default-features = false, features = ["user", "sched", "fs"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
which = "6"
sysinfo = { version = "0.30" }
rusqlite = { version = "0.31", features = ["bundled"] }
sqlite-vec = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
url = "2.5"
readability = "0.2"
tempfile = "3.10"
tokio-tungstenite = "0.21"

[dev-dependencies]
assert_cmd = "2.0"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde_json = "1.0"

[workspace]
members = ["crates/mcp-server"]
