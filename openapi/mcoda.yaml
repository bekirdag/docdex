openapi: 3.1.0
info:
  title: Docdex
  version: 0.1.11
  description: |-
    Local-first, repo-scoped documentation retrieval and chat API.

    By default, the daemon binds to 127.0.0.1 and does not require authentication.
    When started with `--expose`, requests require `Authorization: Bearer <token>`.
servers:
  - url: http://127.0.0.1:3210
tags:
  - name: Chat
    description: OpenAI-compatible chat completions scoped to a repo.
  - name: Graph
    description: Repo-scoped impact graph read APIs.
  - name: Memory
    description: Repo-scoped semantic memory operations.
paths:
  /v1/chat/completions:
    post:
      tags:
        - Chat
      summary: Create chat completion
      description: |-
        OpenAI-compatible chat completions.

        Repo context must be provided via `x-docdex-repo-id` header, `repo_id` query, or request body (`repo_id`/`repo_path`). If missing, the server returns 400.

        When started with `--expose`, requests require `Authorization: Bearer <token>`.
      operationId: createChatCompletion
      parameters:
        - &a4
          name: x-docdex-repo-id
          in: header
          required: false
          schema: &a1
            type: string
            description: SHA256 fingerprint of normalized absolute repo path.
            pattern: ^[a-fA-F0-9]{64}$
          description: Repo fingerprint (SHA256 of normalized absolute repo path).
        - &a5
          name: repo_id
          in: query
          required: false
          schema: *a1
          description: Repo fingerprint (SHA256 of normalized absolute repo path).
      requestBody:
        required: true
        content:
          application/json:
            schema: &a8
              type: object
              additionalProperties: true
              required:
                - messages
              properties:
                repo_id: *a1
                repo_path: &a6
                  type: string
                  description: Normalized absolute repo path.
                model:
                  type: string
                  description: Optional model override; defaults to server configuration.
                messages:
                  type: array
                  minItems: 1
                  items: &a2
                    type: object
                    additionalProperties: false
                    required:
                      - role
                      - content
                    properties:
                      role:
                        type: string
                        enum:
                          - system
                          - user
                          - assistant
                          - tool
                      content:
                        type: string
                      name:
                        type: string
                stream:
                  type: boolean
                  default: false
                max_tokens:
                  type: integer
                  minimum: 1
                temperature:
                  type: number
                  minimum: 0
                top_p:
                  type: number
                  minimum: 0
                  maximum: 1
                force_web:
                  type: boolean
                  description: When true, explicitly allows Tier-2 web enrichment even if local
                    confidence is high.
      responses:
        "200":
          description: Chat completion (JSON when `stream=false`, SSE when `stream=true`).
          content:
            application/json:
              schema: &a11
                type: object
                additionalProperties: false
                required:
                  - id
                  - object
                  - created
                  - choices
                properties:
                  id:
                    type: string
                  object:
                    const: chat.completion
                  created:
                    type: integer
                    minimum: 0
                  model:
                    type: string
                  choices:
                    type: array
                    minItems: 1
                    items: &a9
                      type: object
                      additionalProperties: false
                      required:
                        - index
                        - message
                      properties:
                        index:
                          type: integer
                          minimum: 0
                        message: *a2
                        finish_reason:
                          type:
                            - string
                            - "null"
                  usage: &a10
                    type: object
                    additionalProperties: false
                    properties:
                      prompt_tokens:
                        type: integer
                        minimum: 0
                      completion_tokens:
                        type: integer
                        minimum: 0
                      total_tokens:
                        type: integer
                        minimum: 0
            text/event-stream:
              schema:
                type: string
              examples:
                openai_sse:
                  summary: OpenAI-compatible SSE
                  value: |
                    data: {"id":"cmpl_...","object":"chat.completion.chunk","created":1710000000,"model":"llama3.1:8b","choices":[{"index":0,"delta":{"content":"Hello"},"finish_reason":null}]}

                    data: [DONE]
        "400":
          description: Bad request
          content:
            application/json:
              schema: &a3
                type: object
                additionalProperties: false
                required:
                  - error
                properties:
                  error:
                    type: object
                    additionalProperties: false
                    required:
                      - message
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      retry_after_ms:
                        type: integer
                        minimum: 0
                      retry_at:
                        type: string
                        format: date-time
                      limit_key:
                        type: string
                      scope:
                        type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: *a3
        "404":
          description: Repo unknown or not indexed
          content:
            application/json:
              schema: *a3
        "429":
          description: Rate limited
          content:
            application/json:
              schema: *a3
        "500":
          description: Server error
          content:
            application/json:
              schema: *a3
  /v1/graph/impact:
    get:
      tags:
        - Graph
      summary: Get impact graph for a file
      description: |-
        Returns inbound/outbound dependency edges for a repo-scoped file.

        Edge direction semantics:
        - Each directed edge is `source -> target` where `source` depends on/imports/references `target`.
        - For the requested file `F`, `outbound` contains `target` paths for edges where `source == F`.
        - For the requested file `F`, `inbound` contains `source` paths for edges where `target == F`.

        The response includes an explicit `schema` compatibility signal; see `docs/contracts/code_intelligence_schema_v1.md`.

        When started with `--expose`, requests require `Authorization: Bearer <token>`.
      operationId: getImpactGraph
      parameters:
        - &a7
          name: repo_id
          in: query
          required: true
          schema: *a1
          description: Repo fingerprint (SHA256 of normalized absolute repo path).
        - name: file
          in: query
          required: true
          schema:
            type: string
          description: Repo-relative file path.
        - name: maxEdges
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 1000
          description: Maximum number of edges to return (hard-capped server-side).
        - name: maxDepth
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 100
            default: 10
          description: Maximum traversal depth from the requested file (0 returns no edges).
        - name: edgeTypes
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          description: Optional edge kind/type filter (e.g. import/include/require). When provided, only matching edges are returned.
      responses:
        "200":
          description: Impact graph
          content:
            application/json:
              schema: &a12
                type: object
                additionalProperties: false
                required:
                  - schema
                  - source
                  - inbound
                  - outbound
                properties:
                  schema: &a18
                    $ref: "#/components/schemas/DocdexSchemaInfo"
                  repo_id:
                    $ref: "#/components/schemas/RepoId"
                  source:
                    type: string
                    description: The requested file path.
                  inbound:
                    type: array
                    description: Repo-relative file paths which depend on (import/reference) `source`.
                    items:
                      type: string
                  outbound:
                    type: array
                    description: Repo-relative file paths which `source` depends on (imports/references).
                    items:
                      type: string
                  edges:
                    type: array
                    description: |-
                      Directed edges. Each edge is `source -> target` where `source` depends on `target`.

                      For the requested file `F`:
                      - inbound edges are those with `target == F`
                      - outbound edges are those with `source == F`
                    items:
                      $ref: "#/components/schemas/ImpactGraphEdge"
                  truncated:
                    type: boolean
                    description: True if the response was truncated due to maxEdges/maxDepth limits.
                  applied:
                    type: object
                    additionalProperties: false
                    required:
                      - maxEdges
                      - maxDepth
                    properties:
                      maxEdges:
                        type: integer
                        minimum: 0
                      maxDepth:
                        type: integer
                        minimum: 0
                      edgeTypes:
                        type: array
                        items:
                          type: string
        "400":
          description: Bad request
          content:
            application/json:
              schema: *a3
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: *a3
        "404":
          description: Repo unknown or not indexed
          content:
            application/json:
              schema: *a3
        "500":
          description: Server error
          content:
            application/json:
              schema: *a3
  /v1/memory/store:
    post:
      tags:
        - Memory
      summary: Store a memory
      description: |-
        Stores text plus optional metadata into repo-scoped semantic memory.

        Repo context must be provided via `x-docdex-repo-id` header, `repo_id` query, or request body (`repo_id`/`repo_path`). If missing, the server returns 400.

        When started with `--expose`, requests require `Authorization: Bearer <token>`.
      operationId: memoryStore
      parameters:
        - *a4
        - *a5
      requestBody:
        required: true
        content:
          application/json:
            schema: &a13
              type: object
              additionalProperties: false
              required:
                - text
              properties:
                repo_id: *a1
                repo_path: *a6
                text:
                  type: string
                  minLength: 1
                metadata:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Memory stored
          content:
            application/json:
              schema: &a14
                type: object
                additionalProperties: false
                required:
                  - id
                properties:
                  id:
                    type: string
                    format: uuid
                  created_at:
                    type: integer
                    minimum: 0
        "400":
          description: Bad request
          content:
            application/json:
              schema: *a3
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: *a3
        "404":
          description: Repo unknown or not indexed
          content:
            application/json:
              schema: *a3
        "409":
          description: Memory disabled
          content:
            application/json:
              schema: *a3
        "500":
          description: Server error
          content:
            application/json:
              schema: *a3
  /v1/memory/recall:
    post:
      tags:
        - Memory
      summary: Recall memories
      description: |-
        Semantic recall using embeddings over repo-scoped memory.

        Repo context must be provided via `x-docdex-repo-id` header, `repo_id` query, or request body (`repo_id`/`repo_path`). If missing, the server returns 400.

        When started with `--expose`, requests require `Authorization: Bearer <token>`.
      operationId: memoryRecall
      parameters:
        - *a4
        - *a5
      requestBody:
        required: true
        content:
          application/json:
            schema: &a15
              type: object
              additionalProperties: false
              required:
                - query
              properties:
                repo_id: *a1
                repo_path: *a6
                query:
                  type: string
                  minLength: 1
                top_k:
                  type: integer
                  minimum: 1
                  default: 5
      responses:
        "200":
          description: Recalled memories
          content:
            application/json:
              schema: &a17
                type: object
                additionalProperties: false
                required:
                  - results
                properties:
                  results:
                    type: array
                    items: &a16
                      type: object
                      additionalProperties: false
                      required:
                        - content
                        - score
                      properties:
                        content:
                          type: string
                        score:
                          type: number
                        metadata:
                          type: object
                          additionalProperties: true
        "400":
          description: Bad request
          content:
            application/json:
              schema: *a3
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: *a3
        "404":
          description: Repo unknown or not indexed
          content:
            application/json:
              schema: *a3
        "409":
          description: Memory disabled
          content:
            application/json:
              schema: *a3
        "500":
          description: Server error
          content:
            application/json:
              schema: *a3
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
  parameters:
    XDocdexRepoId: *a4
    RepoIdQueryOptional: *a5
    RepoIdQueryRequired: *a7
  schemas:
    RepoId: *a1
    RepoPath: *a6
    ErrorResponse: *a3
    ChatMessage: *a2
    ChatCompletionRequest: *a8
    ChatCompletionChoice: *a9
    ChatCompletionUsage: *a10
    ChatCompletionResponse: *a11
    ImpactGraphResponse: *a12
    DocdexSchemaCompatRange: &a19
      type: object
      additionalProperties: false
      required:
        - min
        - max
      properties:
        min:
          type: integer
          minimum: 1
        max:
          type: integer
          minimum: 1
    DocdexSchemaInfo:
      type: object
      additionalProperties: false
      required:
        - name
        - version
        - compatible
      properties:
        name:
          type: string
          description: Stable identifier for a payload family (example: `docdex.impact_graph`).
        version:
          type: integer
          minimum: 1
          description: Schema version emitted by the server/tool.
        compatible:
          $ref: "#/components/schemas/DocdexSchemaCompatRange"
    ImpactGraphEdge:
      type: object
      additionalProperties: false
      required:
        - source
        - target
      properties:
        source:
          type: string
          description: Repo-relative file path of the depender/importer.
        target:
          type: string
          description: Repo-relative file path of the dependee/imported file.
        kind:
          type: string
          description: Optional edge classifier (e.g. `import`, `include`, `require`).
    MemoryStoreRequest: *a13
    MemoryStoreResponse: *a14
    MemoryRecallRequest: *a15
    MemoryHit: *a16
    MemoryRecallResponse: *a17
