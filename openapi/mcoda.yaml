        repoId:
          $ref: "#/components/schemas/RepoId"
    AstQueryMatch:
      type: object
      additionalProperties: false
      required:
        - file
        - matchCount
        - samples
      properties:
        file:
          type: string
          description: Repo-relative file path.
        matchCount:
          type: integer
          minimum: 0
          description: Number of matching AST nodes found in the file.
        samples:
