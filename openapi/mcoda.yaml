    AstQueryResponse:
      type: object
      additionalProperties: false
      required:
        - schema
        - repo_id
        - kinds
        - mode
        - limit
        - sampleLimit
        - truncated
        - matches
      properties:
        schema:
          $ref: "#/components/schemas/DocdexSchemaInfo"
        repoId:
          $ref: "#/components/schemas/RepoId"
        kinds:
          type: array
          items:
            type: string
        mode:
          type: string
        limit:
          type: integer
          minimum: 1
        sampleLimit:
          type: integer
          minimum: 1
        truncated:
          type: boolean
        name:
          type: string
        field:
          type: string
        pathPrefix:
          type: string
        matches:
          type: array
          items:
            $ref: "#/components/schemas/AstQueryMatch"
    ImpactGraphDiagnostics:
      type: object
      additionalProperties: false
      required:
        - unresolvedImportsTotal
        - unresolvedImportsSample
