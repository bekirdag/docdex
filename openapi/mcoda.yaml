        kinds:
          type: array
          items:
            type: string
        mode:
          type: string
          enum:
            - any
            - all
        limit:
          type: integer
          minimum: 1
        truncated:
          type: boolean
        matches:
          type: array
          items:
            $ref: "#/components/schemas/AstSearchMatch"
    AstQueryRequest:
      type: object
      additionalProperties: false
      required:
        - kinds
      properties:
        kinds:
          type: array
          items:
            type: string
          description: Tree-sitter node kinds to match.
        name:
