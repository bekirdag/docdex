map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream docdex_backend {
    server 127.0.0.1:28491;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.docdex.org service.docdex.org auth.docdex.org;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.docdex.org service.docdex.org auth.docdex.org;

    ssl_certificate /etc/letsencrypt/live/api.docdex.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.docdex.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 64m;

    location / {
        proxy_pass http://docdex_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
