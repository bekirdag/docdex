use_default_settings: true

general:
  debug: false
  instance_name: Overrid SearXNG

search:
  safe_search: 0
  formats:
    - html
    - json

server:
  base_url: https://se.overrid.com/
  limiter: true
  public_instance: true
  secret_key: overridden-by-SEARXNG_SECRET

outgoing:
  # SearXNG's stock 3s budget is too tight for this deployment: DuckDuckGo and
  # several other reachable engines were reported as `timeout` on every query.
  # An engine that misses the budget is dropped silently, so a short timeout
  # looks identical to an engine that is blocking us.
  request_timeout: 8.0
  max_request_timeout: 15.0
  pool_connections: 200
  pool_maxsize: 40
  enable_http2: true

# Engine selection below was measured against this deployment by querying each
# engine individually; counts in the comments are results returned for a
# representative query. Engines that answered nothing or refused the datacenter
# IP (mojeek, yahoo, fireball, fastbot, tusksearch, yandex, metacpan, pypi,
# rubygems, anaconda, bitbucket, wikipedia, wikidata, arch linux wiki,
# habrahabr, ollama) are deliberately left out. Engines are re-tested with a
# domain-appropriate query before exclusion: several are simply quiet outside
# their own subject area rather than broken.
#
# Brave, Google CSE, Qwant, and Startpage stay enabled from the defaults but are
# permanently suspended here: they are unauthenticated scrapers hitting services
# that block datacenter IPs. They recover only behind a residential proxy or,
# for Google CSE, a valid API key.
engines:
  # --- General web -----------------------------------------------------------
  # Kept broad so one upstream CAPTCHA or suspension cannot empty a response.
  - name: bing
    disabled: false
    timeout: 8.0
  - name: dogpile
    disabled: false
    timeout: 8.0
  - name: privacywall
    disabled: false
    timeout: 8.0
  - name: seznam
    disabled: false
  - name: searchch
    disabled: false
  - name: qwant
    disabled: false
  # Given generous headroom because they fail on timeout, not on blocking.
  - name: duckduckgo
    disabled: false
    timeout: 12.0
  - name: duckduckgo web
    disabled: false
    timeout: 12.0
  # Independent indexes and aggregators that answer from this IP without a
  # CAPTCHA wall. mwmbl runs its own crawler; the rest are metasearch.
  - name: mwmbl            # 28
    disabled: false
    timeout: 8.0
  - name: gabanza          # 30
    disabled: false
    timeout: 8.0
  - name: resulthunter     # 20
    disabled: false
    timeout: 8.0
  - name: zapmeta          # 9
    disabled: false
    timeout: 8.0
  - name: infospace        # 8
    disabled: false
    timeout: 8.0
  - name: searchtoday      # 8
    disabled: false
    timeout: 8.0
  - name: searchmysite     # 10, independent-web index
    disabled: false
  - name: yep              # 20; refused us once, healthy on retest
    disabled: false
    timeout: 8.0
  - name: crowdview        # 40 on discussion-shaped queries
    disabled: false
    timeout: 8.0
  - name: wiby             # 12, small/old-web index
    disabled: false
  # Fail on timeout rather than refusal, so they get the widest budget and may
  # recover once the 8s outgoing default is deployed.
  - name: encyclosearch
    disabled: false
    timeout: 12.0

  # --- Code, docs, and Q&A ---------------------------------------------------
  # Docdex asks code and documentation questions, so these carry far more signal
  # per request than additional general engines. Reached because Docdex sends
  # `categories=general,it`.
  - name: stackoverflow    # 10
    disabled: false
    timeout: 8.0
  - name: askubuntu        # 10
    disabled: false
  - name: superuser        # 10
    disabled: false
  - name: github           # 30
    disabled: false
    timeout: 8.0
  - name: gitlab
    disabled: false
  - name: "gitea.com"      # 10
    disabled: false
  - name: codeberg         # times out at 3s; retry with the wider budget
    disabled: false
    timeout: 8.0
  - name: mdn              # 10
    disabled: false
    timeout: 8.0
  - name: microsoft learn  # 10
    disabled: false
  - name: hackernews       # 24
    disabled: false
  - name: "lobste.rs"      # 20
    disabled: false
  - name: "discuss.python"
    disabled: false
  - name: sourcehut        # 15
    disabled: false
  - name: mankier          # 20, man pages for CLI questions
    disabled: false
  - name: "nixos wiki"
    disabled: false
    timeout: 12.0
  - name: free software directory
    disabled: false
    timeout: 12.0

  # --- Package registries ----------------------------------------------------
  # Each is quiet outside its own ecosystem, so they cost nothing on unrelated
  # queries and are authoritative on their own.
  - name: "crates.io"      # 10
    disabled: false
  - name: "lib.rs"         # 119
    disabled: false
  - name: npm              # 25
    disabled: false
  - name: "pkg.go.dev"     # 50
    disabled: false
  - name: packagist        # 15
    disabled: false
  - name: hex              # 10
    disabled: false
  - name: "pub.dev"
    disabled: false
  - name: hoogle           # 13
    disabled: false
  - name: docker hub       # 10
    disabled: false
  - name: alpine linux packages  # 50
    disabled: false
  - name: gentoo           # 5
    disabled: false
  - name: huggingface      # large result sets for model/dataset queries
    disabled: false
  - name: national vulnerability database  # 10, CVE lookups
    disabled: false

valkey:
  url: valkey://valkey:6379/0
