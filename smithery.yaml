target: 'local'
startCommand:
  type: "stdio"
  commandFunction: |-
    (config) => ({
      command: 'node',
      args: [
        'smithery/entry.js',
        `repo_path=${config?.repo_path || '.'}`,
        `log_level=${config?.log_level || 'warn'}`,
        `max_results=${config?.max_results ?? 8}`
      ]
    })
configSchema:
  type: "object"
  properties:
    repo_path:
      type: "string"
      description: "Repo root to index for the local Docdex MCP server"
      default: "."
    log_level:
      type: "string"
      description: "Log level for MCP server output"
      enum:
        - "trace"
        - "debug"
        - "info"
        - "warn"
        - "error"
      default: "warn"
    max_results:
      type: "integer"
      minimum: 1
      description: "Max results to return per tool call (server clamps to its max)"
      default: 8
exampleConfig:
  repo_path: "."
