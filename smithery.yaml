target: 'local'
dockerfile: './Dockerfile'
startCommand:
  type: "stdio"
  commandFunction: |-
    (config) => ({
      command: 'docdexd',
      args: [
        'mcp',
        '--repo',
        config.repo_path,
        '--log',
        'warn',
        '--max-results',
        '8'
      ]
    })
  configSchema:
    type: "object"
    properties:
      repo_path:
        type: "string"
        description: "Repo root to index for the local Docdex MCP server"
    required:
      - "repo_path"
  exampleConfig:
    repo_path: "."
